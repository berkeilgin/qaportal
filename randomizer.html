<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Randomizer Tool</title>

<link rel="stylesheet" href="gorsel.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>

<body>

<div class="header">
  <div>🎲 Randomizer Tool</div>

  <div class="right">

    <button id="backBtnPlain">⬅ Geri</button>

    <label class="switch">
      <input type="checkbox" id="themeToggle">
      <div class="slider"></div>
      <span id="themeText">🌙 Dark</span>
    </label>

  </div>
</div>

<div class="container">

  <!-- PAGE SWITCH -->
  <div class="page-switch">
    <button class="switch-btn active" id="excelPageBtn">
      📂 Excel Randomizer
    </button>

    <button class="switch-btn" id="manualPageBtn">
      🔢 Manuel Randomizer
    </button>
  </div>

  <!-- EXCEL PAGE -->
  <div id="excelPage">

    <h2>📂 Görüşme Randomizer</h2>

    <div id="drop" class="drop">
      📥 Excel / CSV dosyası sürükle veya tıkla
    </div>

    <input type="file" id="fileInput" hidden accept=".xlsx,.xls,.csv">

    <div class="section">
      <label class="big-label">
        🎧 Dinlenecek Çağrı Sayısı
      </label>

      <input type="number" id="randomCount" min="1" value="5">
    </div>

    <button class="btn" id="randomBtn">
      🎲 Random Görüşme Seç
    </button>

    <button class="btn secondary" id="exportBtn">
      ⬇ Excel Export
    </button>

    <div id="status" class="status">
      Bekleniyor...
    </div>

  </div>

  <!-- MANUAL PAGE -->
  <div id="manualPage" class="hidden-page">

    <h2>🔢 Manuel Random Seçim</h2>

    <div class="manual-box">

      <div class="manual-item">
        <label>Minimum</label>
        <input type="number" value="1" disabled>
      </div>

      <div class="manual-item">
        <label>Maksimum</label>
        <input type="number" id="maxNumber" value="100" min="1">
      </div>

    </div>

    <button class="btn" id="manualBtn">
      🎯 Kaçıncıyı Dinlemeliyim?
    </button>

    <div id="manualResult" class="manual-result">
      -
    </div>

    <div class="log-section">

      <div class="log-header">
        <h3>📝 Dinleme Geçmişi</h3>

        <button class="clear-btn" id="clearLogBtn">
          🗑 Temizle
        </button>
      </div>

      <div id="logList" class="log-list">
        Henüz seçim yapılmadı.
      </div>

    </div>

  </div>

</div>

<script src="random.js"></script>

</body>
</html>
