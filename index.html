<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>QA Portal</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Segoe UI,Arial;
  background:#1e1e2f;
  color:#fff;
  display:flex;
  transition:.3s;
}

/* LIGHT MODE */
body.light{
  background:#f4f6fb;
  color:#111;
}

body.light .sidebar{background:#fff;}
body.light .card{background:#fff;color:#111;}
body.light .section-title{color:#333;}
body.light .nav a{color:#333;}
body.light .nav a.active{background:#e6e9f5;}
body.light .sidebar-section h4{color:#333;}
body.light .small-btn{background:#e6e9f5;color:#111;}
body.light .switch{background:#fff;color:#111;}

/* SIDEBAR */
.sidebar{
  width:220px;
  background:#151521;
  min-height:100vh;
  position:fixed;
  left:0;
  top:0;
  padding:20px;
}

.logo{
  display:flex;
  gap:10px;
  align-items:center;
  margin-bottom:15px;
}

.logo img{width:30px;height:30px;}

.nav a{
  display:block;
  padding:10px;
  color:#aaa;
  cursor:pointer;
  border-radius:8px;
}

.nav a.active{
  background:#2c2c3e;
  color:#fff;
}

/* MAIN */
.main{
  margin-left:220px;
  padding:30px;
  width:100%;
}

.section{display:none;}
.section.active{display:block;}

.section-title{
  color:#aaa;
  margin:10px 0;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:15px;
}

/* CARD */
.card{
  background:#2c2c3e;
  height:150px;
  border-radius:14px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  position:relative;
  cursor:pointer;
  overflow:hidden;
}

.card.new{animation:pulseGlow 1.6s ease-out 1;}

@keyframes pulseGlow{
  0%{box-shadow:0 0 0 rgba(255,59,59,0);}
  50%{box-shadow:0 0 18px rgba(255,59,59,0.55);}
  100%{box-shadow:0 0 0 rgba(255,59,59,0);}
}

.new-ribbon{
  position:absolute;
  top:12px;
  right:-32px;
  background:#ff3b3b;
  color:#fff;
  font-size:10px;
  padding:4px 38px;
  transform:rotate(45deg);
  font-weight:bold;
}

.test-ribbon{
  position:absolute;
  top:12px;
  left:-32px;
  background:#ffd500;
  color:#111;
  font-size:10px;
  padding:4px 38px;
  transform:rotate(-45deg);
  font-weight:bold;
}

/* FAVORITE */
.fav-btn{
  margin-top:8px;
  padding:6px 10px;
  border:none;
  border-radius:8px;
  font-size:11px;
  cursor:pointer;
  background:#1f1f2d;
  color:#aaa;
}

.fav-btn.active{background:gold;color:#111;font-weight:bold;}

.card img{width:32px;height:32px;margin-bottom:8px;}
.card-title{font-size:13px;text-align:center;}

/* SIDEBAR */
.sidebar-section{margin-top:20px;}
.sidebar-section h4{font-size:12px;color:#777;margin-bottom:8px;}

.sidebar-item{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:13px;
  margin-bottom:6px;
  cursor:pointer;
}

.sidebar-item img{width:18px;height:18px;}

.small-btn{
  margin-top:8px;
  width:100%;
  padding:6px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  background:#2c2c3e;
  color:#fff;
}

/* TOPBAR */
.topbar{
  position:fixed;
  right:10px;
  top:10px;
}

.switch{
  display:flex;
  align-items:center;
  gap:10px;
  background:#2c2c3e;
  padding:8px 14px;
  border-radius:30px;
  cursor:pointer;
}

.switch input{display:none;}

.slider{
  width:46px;
  height:24px;
  background:#555;
  border-radius:20px;
  position:relative;
}

.slider:before{
  content:"";
  position:absolute;
  width:18px;
  height:18px;
  background:#fff;
  border-radius:50%;
  left:3px;
  top:3px;
}

.switch input:checked + .slider{
  background:#4caf50;
}

/* 🔴 MAINTENANCE SCREEN */
#maintenance{
  position:fixed;
  inset:0;
  background:#111;
  color:#fff;
  display:none;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  z-index:999999;
  text-align:center;
}

#maintenance h1{
  color:#ff3b3b;
}

</style>
</head>

<body>

<!-- 🔴 MAINTENANCE SCREEN -->
<div id="maintenance">
  <h1>🔧 Sistem Bakımda</h1>
  <p>Portal geçici olarak kapalıdır</p>
  <p id="mt">Kontrol...</p>
</div>

<!-- TOP -->
<div class="topbar">
<label class="switch">
  <input type="checkbox" onchange="toggleTheme()">
  <div class="slider"></div>
</label>
</div>

<!-- SIDEBAR -->
<div class="sidebar">

  <div class="logo">
    <img src="logo.png">
    <strong>Portal</strong>
  </div>

  <div class="nav">
    <a class="active" onclick="show('all',this)">Dashboard</a>
    <a onclick="show('tp',this)">TP Tools</a>
    <a onclick="show('qa',this)">QA Tools</a>
    <a onclick="show('reports',this)">Reports</a>
    <a onclick="show('office',this)">Office</a>
  </div>

  <div class="sidebar-section">
    <h4>Favoriler ⭐</h4>
    <div id="favList"></div>
    <button class="small-btn" onclick="clearFav()">Temizle</button>
  </div>

  <div class="sidebar-section">
    <h4>Son Kullanılan</h4>
    <div id="recentList"></div>
  </div>

</div>

<!-- MAIN -->
<div class="main">
<h2>Dashboard</h2>
<div id="app"></div>
</div>

<script>

/* 🔴 MAINTENANCE SWITCH */
const MAINTENANCE_MODE = 0;

if(MAINTENANCE_MODE === 1){
  document.getElementById("maintenance").style.display="flex";

  let t=10;
  setInterval(()=>{
    document.getElementById("mt").innerText="Yeniden kontrol: "+t;
    t--;
    if(t<=0) location.reload();
  },1000);
}

/* DATA */
const tools=[

  {id:"bms",name:"TP BMS",icon:"tp_bms.png",cat:"tp",isNew:0,isTest:0,url:"https://sebra.ccms.teleperformance.com/"},
  {id:"mytp",name:"MYTP",icon:"mytp.png",cat:"tp",isNew:0,isTest:0,url:"https://teleperformance-mytp.sabacloud.com/"},
  {id:"random",name:"Randomizer",icon:"logo.png",cat:"qa",isNew:1,isTest:0,url:"randomizer.html"},
  {id:"corel",name:"Correlation",icon:"logo.png",cat:"qa",isNew:0,isTest:1,url:"corel.html"},
  {id:"csv",name:"Data CSV",icon:"logo.png",cat:"qa",isNew:1,isTest:0,url:"csvconverter.html"},
  {id:"sampling",name:"BSH",icon:"logo.png",cat:"qa",isNew:0,isTest:0,url:"sampling.html"},
  {id:"trceviri",name:"Trendyol",icon:"logo.png",cat:"qa",isNew:1,isTest:0,url:"trendyolceviri.html"},
  {id:"powerbifb",name:"Feedback",icon:"powerbi.png",cat:"reports",isNew:0,isTest:0,url:"https://app.powerbi.com/"},
  {id:"powerbidm",name:"Domestic",icon:"powerbi.png",cat:"reports",isNew:0,isTest:0,url:"https://app.powerbi.com/"},
  {id:"excel",name:"Excel",icon:"excel.png",cat:"office",isNew:0,isTest:0,url:"https://excel.cloud.microsoft/"},
  {id:"ppt",name:"PowerPoint",icon:"powerpoint.png",cat:"office",isNew:0,isTest:0,url:"https://powerpoint.cloud.microsoft/"},
  {id:"word",name:"Word",icon:"word.png",cat:"office",isNew:0,isTest:0,url:"https://word.cloud.microsoft/"}
];

/* THEME */
function toggleTheme(){
  document.body.classList.toggle("light");
}

/* FAVORITE */
function getFav(){
  return JSON.parse(localStorage.getItem("fav")||"[]");
}

function toggleFav(id){
  let f=getFav();
  f.includes(id)?f=f.filter(x=>x!==id):f.push(id);
  localStorage.setItem("fav",JSON.stringify(f));
  render();
}

/* FAVORİ CLICK FIX */
function updateFav(){
  let fav=getFav();
  document.getElementById("favList").innerHTML=
    fav.map(id=>{
      let t=tools.find(x=>x.id===id);
      return t?`<div class="sidebar-item" onclick="openTool('${id}')">
      <img src="${t.icon}">${t.name}</div>`:"";
    }).join("");
}

/* RECENT */
function openTool(id){
  let t=tools.find(x=>x.id===id);
  let r=JSON.parse(localStorage.getItem("recent")||"[]");
  r=[id,...r.filter(x=>x!==id)].slice(0,5);
  localStorage.setItem("recent",JSON.stringify(r));
  updateRecent();

  if(t.url.endsWith(".html")) location.href=t.url;
  else window.open(t.url);
}

function updateRecent(){
  let r=JSON.parse(localStorage.getItem("recent")||"[]");
  document.getElementById("recentList").innerHTML=
    r.map(id=>{
      let t=tools.find(x=>x.id===id);
      return t?`<div class="sidebar-item" onclick="openTool('${id}')">
      <img src="${t.icon}">${t.name}</div>`:"";
    }).join("");
}

/* RENDER */
function render(){
  const app=document.getElementById("app");
  app.innerHTML="";
  ["tp","qa","reports","office"].forEach(cat=>{
    let sec=document.createElement("div");
    sec.className="section active";
    sec.innerHTML=`
      <div class="section-title">${cat.toUpperCase()}</div>
      <div class="grid">
        ${tools.filter(t=>t.cat===cat).map(t=>`
        <div class="card" onclick="openTool('${t.id}')">
          <img src="${t.icon}">
          <div class="card-title">${t.name}</div>
          <button class="fav-btn ${getFav().includes(t.id)?'active':''}"
          onclick="event.stopPropagation();toggleFav('${t.id}')">★</button>
        </div>`).join("")}
      </div>`;
    app.appendChild(sec);
  });
  updateFav();
  updateRecent();
}

function show(){}

/* INIT */
render();

</script>

</body>
</html>
