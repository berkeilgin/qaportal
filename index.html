<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>QA Portal</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:Segoe UI,Arial;background:#1e1e2f;color:#fff;display:flex;transition:.3s;}
body.light{background:#f4f6fb;color:#111;}
body.light .sidebar{background:#fff;}
body.light .card{background:#fff;color:#111;}
body.light .section-title{color:#333;}
body.light .nav a{color:#333;}
body.light .nav a.active{background:#e6e9f5;}
body.light .sidebar-section h4{color:#333;}
body.light .small-btn{background:#e6e9f5;color:#111;}
body.light .switch{background:#fff;color:#111;}

.sidebar{width:220px;background:#151521;min-height:100vh;position:fixed;left:0;top:0;padding:20px;}
.logo{display:flex;gap:10px;align-items:center;margin-bottom:15px;}
.logo img{width:30px;height:30px;}
.nav a{display:block;padding:10px;color:#aaa;cursor:pointer;border-radius:8px;}
.nav a.active{background:#2c2c3e;color:#fff;}

.main{margin-left:220px;padding:30px;width:100%;}
.section{display:none;}
.section.active{display:block;}
.section-title{color:#aaa;margin:10px 0;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:15px;}

.card{background:#2c2c3e;height:150px;border-radius:14px;display:flex;flex-direction:column;justify-content:center;align-items:center;position:relative;cursor:pointer;}
.new-ribbon{position:absolute;top:12px;right:-32px;background:#ff3b3b;color:#fff;font-size:10px;padding:4px 38px;transform:rotate(45deg);}
.test-ribbon{position:absolute;top:12px;left:-32px;background:#ffd500;color:#111;font-size:10px;padding:4px 38px;transform:rotate(-45deg);}
.fav-btn{margin-top:8px;padding:6px 10px;border:none;border-radius:8px;font-size:11px;cursor:pointer;background:#1f1f2d;color:#aaa;}
.fav-btn.active{background:gold;color:#111;font-weight:bold;}
.card img{width:32px;height:32px;margin-bottom:8px;}

.sidebar-section{margin-top:20px;}
.sidebar-section h4{font-size:12px;color:#777;margin-bottom:8px;}
.sidebar-item{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:6px;}
.sidebar-item img{width:18px;height:18px;}

.small-btn{margin-top:8px;width:100%;padding:6px;border:none;border-radius:8px;cursor:pointer;background:#2c2c3e;color:#fff;}
.topbar{position:fixed;right:10px;top:10px;}

.switch{display:flex;align-items:center;gap:10px;background:#2c2c3e;padding:8px 14px;border-radius:30px;cursor:pointer;}
.switch input{display:none;}
.slider{width:46px;height:24px;background:#555;border-radius:20px;position:relative;}
.slider:before{content:"";position:absolute;width:18px;height:18px;background:#fff;border-radius:50%;left:3px;top:3px;transition:.3s;}
.switch input:checked + .slider{background:#4caf50;}
.switch input:checked + .slider:before{transform:translateX(22px);}
</style>
</head>

<body>

<div class="topbar">
<label class="switch">
<input type="checkbox" onchange="toggleTheme()">
<div class="slider"></div>
<span id="themeText">🌙 Dark</span>
</label>
</div>

<div class="sidebar">
<div class="logo">
<img src="logo.png">
<strong>Portal</strong>
</div>

<div class="nav">
<a class="active" onclick="show('all',this)">Dashboard</a>
<a onclick="show('tp',this)">TP Tools</a>
<a onclick="show('qa',this)">QA Tools</a>
<a onclick="show('reports',this)">Power BI Reports</a>
<a onclick="show('office',this)">Microsoft Office</a>
</div>

<div class="sidebar-section">
<h4>Favoriler ⭐</h4>
<div id="favList"></div>
<button class="small-btn" onclick="clearFav()">Temizle</button>
</div>

<div class="sidebar-section">
<h4>Son Kullanılan</h4>
<div id="recentList"></div>
</div>
</div>

<div class="main">
<h2>Dashboard</h2>
<div id="app"></div>
</div>

<script>

// ✅ GLOBAL MAINTENANCE
const CONFIG = { TECHNICAL: 0 };
if (CONFIG.TECHNICAL === 1 && !location.pathname.includes("technical.html")) {
  location.href = "technical.html";
}

// ✅ TOOLS
const tools=[
{id:"bms",name:"TP BMS",icon:"tp_bms.png",cat:"tp",isNew:0,isTest:0,technical:0,url:"https://sebra.ccms.teleperformance.com/"},
{id:"mytp",name:"MYTP",icon:"mytp.png",cat:"tp",isNew:0,isTest:0,technical:0,url:"https://teleperformance-mytp.sabacloud.com/"},
{id:"random",name:"Randomizer",icon:"logo.png",cat:"qa",isNew:1,isTest:0,technical:0,url:"randomizer.html"},
{id:"corel",name:"Correlation",icon:"logo.png",cat:"qa",isNew:0,isTest:1,technical:0,url:"corel.html"},
{id:"csv",name:"Data CSV Converter",icon:"logo.png",cat:"qa",isNew:1,isTest:0,technical:0,url:"csvconverter.html"},
{id:"sampling",name:"BSH Dağıtım",icon:"logo.png",cat:"qa",isNew:0,isTest:0,technical:0,url:"sampling.html"},
{id:"trceviri",name:"Trendyol CSV Converter",icon:"logo.png",cat:"qa",isNew:1,isTest:0,technical:0,url:"trendyolceviri.html"},
{id:"powerbifb",name:"Feedback Raporu",icon:"powerbi.png",cat:"reports",isNew:0,isTest:0,technical:0,url:"https://app.powerbi.com/"},
{id:"powerbidm",name:"Domestic - Kalite Raporu",icon:"powerbi.png",cat:"reports",isNew:0,isTest:0,technical:0,url:"https://app.powerbi.com/"},
{id:"excel",name:"Excel",icon:"excel.png",cat:"office",isNew:0,isTest:0,technical:0,url:"https://excel.cloud.microsoft/"},
{id:"ppt",name:"PowerPoint",icon:"powerpoint.png",cat:"office",isNew:0,isTest:0,technical:0,url:"https://powerpoint.cloud.microsoft/"},
{id:"word",name:"Word",icon:"word.png",cat:"office",isNew:0,isTest:0,technical:0,url:"https://word.cloud.microsoft/"}
];

// ✅ TOOL OPEN
function openTool(id){
  let t=tools.find(x=>x.id===id);
  if(!t) return;

  if(t.technical === 1){
    location.href="technical.html";
    return;
  }

  if(t.url.endsWith(".html")){
    location.href=t.url;
  } else {
    window.open(t.url,"_blank");
  }
}

// minimal render
const app=document.getElementById("app");
app.innerHTML = `<div class="grid">${tools.map(t => `
<div class="card" onclick="openTool('${t.id}')
<div>${t.name}</div>
</div>`).join("")}</div>`;

function toggleTheme(){
 document.body.classList.toggle("light");
}

</script>

</body>
</html>
