<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Trendyol CSV Tool</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>

body {
  margin:0;
  font-family:Arial;
  background:#1e1e2f;
  color:white;
  transition:0.3s;
}

/* LIGHT MODE */
body.light{
  background:#f4f4f4;
  color:#222;
}

body.light .header,
body.light .container{
  background:white;
  color:#222;
}

body.light .loader{
  background:#ddd;
  color:#222;
}

.header {
  padding:15px 20px;
  background:#2c2c3e;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.left{
  display:flex;
  align-items:center;
  gap:10px;
}

.right{
  display:flex;
  align-items:center;
  gap:10px;
}

.container {
  max-width:700px;
  margin:40px auto;
  padding:30px;
  background:#2c2c3e;
  border-radius:12px;
  text-align:center;
}

.btn,
.run-btn {
  padding:12px 20px;
  background:#4CAF50;
  border:none;
  color:white;
  border-radius:8px;
  cursor:pointer;
  margin:10px;
}

.loader {
  display:none;
  margin-top:10px;
  padding:8px;
  background:#333;
  border-radius:8px;
  animation:pulse 1s infinite;
}

@keyframes pulse {
  0% {opacity:0.5}
  50% {opacity:1}
  100% {opacity:0.5}
}

/* DARK LIGHT SWITCH */
.switch{
  display:flex;
  align-items:center;
  gap:8px;
  cursor:pointer;
  user-select:none;
}

.switch input{
  display:none;
}

.slider{
  width:45px;
  height:24px;
  background:#666;
  border-radius:30px;
  position:relative;
  transition:.3s;
}

.slider::before{
  content:"";
  position:absolute;
  width:18px;
  height:18px;
  background:white;
  border-radius:50%;
  top:3px;
  left:3px;
  transition:.3s;
}

.switch input:checked + .slider::before{
  transform:translateX(21px);
}

.switch input:checked + .slider{
  background:#4CAF50;
}

</style>
</head>

<body>

<div class="header">

  <div class="left">
    📊 Trendyol CSV Tool
  </div>

  <div class="right">

    <button class="run-btn" style="background:#555" onclick="goBack()">
      ⬅ Geri
    </button>

    <label class="switch">
      <input type="checkbox" onchange="toggleTheme()">
      <div class="slider"></div>
      <span id="themeText">🌙 Dark</span>
    </label>

  </div>

</div>

<div class="container">

  <h3>📁 Özet Data</h3>
  <input type="file" id="file1" multiple>
  <div id="loader1" class="loader">⏳ Özet yükleniyor...</div>

  <h3>📁 Detay Data</h3>
  <input type="file" id="file2" multiple>
  <div id="loader2" class="loader">⏳ Detay yükleniyor...</div>

  <br>

  <button class="btn" onclick="exportAll()">💾 Excel İndir</button>
  <button class="btn" onclick="resetAll()">🧹 Temizle</button>

  <div id="status">Bekleniyor...</div>

  <div id="exportLoader" class="loader">⏳ Excel hazırlanıyor...</div>

</div>

<script>

var data1 = [];
var data2 = [];
var detayLoaded = false;

// ================= THEME =================
function toggleTheme(){
  document.body.classList.toggle("light");

  themeText.innerText =
    document.body.classList.contains("light")
      ? "☀️ Light"
      : "🌙 Dark";
}

// ================= BACK =================
function goBack(){
  window.location.href = "index.html";
}

// ================= TURKEY DATE FIX =================

// Excel serial date → JS Date
function excelDateToJSDate(serial){

  const utc_days = Math.floor(serial - 25569);
  const utc_value = utc_days * 86400;

  const date_info = new Date(utc_value * 1000);

  const fractional_day = serial - Math.floor(serial) + 0.0000001;

  let totalSeconds = Math.floor(86400 * fractional_day);

  const seconds = totalSeconds % 60;
  totalSeconds -= seconds;

  const hours = Math.floor(totalSeconds / (60 * 60));
  const minutes = Math.floor(totalSeconds / 60) % 60;

  // ✅ Fazladan +3 kaldırıldı
  date_info.setHours(hours);
  date_info.setMinutes(minutes);
  date_info.setSeconds(seconds);

  return date_info;
}

// UNIVERSAL DATE FIX
function parseDate(val){

  if(!val) return "";

  // Excel numeric date
  if(!isNaN(val)){
    let d = excelDateToJSDate(Number(val));
    return formatDateTR(d);
  }

  // String parse
  let d = new Date(val);

  if(!isNaN(d)){

    // ✅ Türkiye timezone düzeltmesi
    d = new Date(
      d.toLocaleString("en-US", {
        timeZone: "Europe/Istanbul"
      })
    );

    return formatDateTR(d);
  }

  return val;
}

// FORMAT DATE
function formatDateTR(d){

  let day = String(d.getDate()).padStart(2,'0');
  let month = String(d.getMonth()+1).padStart(2,'0');
  let year = d.getFullYear();

  let h = String(d.getHours()).padStart(2,'0');
  let m = String(d.getMinutes()).padStart(2,'0');

  return `${day}.${month}.${year} ${h}:${m}`;
}

// NUMBER SAFE
function toNumber(val){
  return Number(String(val).replace(",", ".")) || 0;
}

// STATUS
function updateStatus(){

  document.getElementById("status").innerText =
    `Özet: ${data1.length} | Detay: ${data2.length}`;
}

// ================= QUERY1 =================
file1.addEventListener('change', async (e)=>{

  document.getElementById("loader1").style.display = "block";

  data1 = [];

  const files = Array.from(e.target.files);

  for(const f of files){

    const buffer = await f.arrayBuffer();

    const wb = XLSX.read(buffer);

    let rows = XLSX.utils.sheet_to_json(
      wb.Sheets[wb.SheetNames[0]],
      { defval:"" }
    );

    rows = rows
      .filter(r => r["Iptal"] === "Hayır")
      .map(r => {

        let obj = {};

        for(let k in r){

          let val = r[k];

          if(k.includes("Tarih")){
            val = parseDate(val);
          }

          obj[k] = val;
        }

        obj.Puan = toNumber(obj.Puan);

        return obj;
      });

    data1 = data1.concat(rows);
  }

  document.getElementById("loader1").style.display = "none";

  updateStatus();
});

// ================= QUERY2 =================
file2.addEventListener('change', async (e)=>{

  document.getElementById("loader2").style.display = "block";

  data2 = [];
  detayLoaded = false;

  const files = Array.from(e.target.files);

  for(const f of files){

    const buffer = await f.arrayBuffer();

    const wb = XLSX.read(buffer);

    let rows = XLSX.utils.sheet_to_json(
      wb.Sheets[wb.SheetNames[0]],
      { defval:"" }
    );

    rows = rows
      .map(r => {

        let obj = {};

        for(let k in r){

          let val = r[k];

          // CEVAP + SORU TEMİZLİK
          if(k === "Cevap" || k === "Soru"){

            val = String(val || "")
              .replace(/\s+/g, " ")
              .replace(/^\s+|\s+$/g, "");
          }

          // TARİH
          if(k.includes("Tarih")){
            val = parseDate(val);
          }

          obj[k] = val;
        }

        obj.Puan = toNumber(obj.Puan);
        obj.Sure = toNumber(obj.Sure);

        return obj;
      })
      .filter(r => r["Iptal"] === "Hayır");

    data2 = data2.concat(rows);
  }

  detayLoaded = true;

  document.getElementById("loader2").style.display = "none";

  updateStatus();
});

// ================= EXPORT =================
function exportAll(){

  if(!data1.length){
    alert("Özet data yok");
    return;
  }

  if(!detayLoaded){
    alert("Detay yüklenmeden export olmaz");
    return;
  }

  document.getElementById("exportLoader").style.display = "block";

  setTimeout(()=>{

    const wb = XLSX.utils.book_new();

    XLSX.utils.book_append_sheet(
      wb,
      XLSX.utils.json_to_sheet(data1),
      "Özet Data"
    );

    XLSX.utils.book_append_sheet(
      wb,
      XLSX.utils.json_to_sheet(data2),
      "Detay Data"
    );

    // ✅ Türkiye saatiyle dosya tarihi
    let trNow = new Date(
      new Date().toLocaleString("en-US", {
        timeZone: "Europe/Istanbul"
      })
    );

    let fileName =
      `${String(trNow.getDate()).padStart(2,'0')}-` +
      `${String(trNow.getMonth()+1).padStart(2,'0')}-` +
      `${trNow.getFullYear()}_TrendyolMPData.xlsx`;

    XLSX.writeFile(wb, fileName);

    document.getElementById("exportLoader").style.display = "none";

  },150);
}

// ================= RESET =================
function resetAll(){

  data1 = [];
  data2 = [];
  detayLoaded = false;

  file1.value = "";
  file2.value = "";

  updateStatus();
}

</script>

</body>
</html>
