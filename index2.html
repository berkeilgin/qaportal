<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>QA Portal2</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:Segoe UI,Arial;
  background:#1e1e2f;
  color:#fff;
  display:flex;
  transition:.3s;
}

body.light{
  background:#f4f6fb;
  color:#111;
}

.sidebar{
  width:220px;
  background:#151521;
  min-height:100vh;
  position:fixed;
  left:0;top:0;
  padding:20px;
}

.logo{display:flex;gap:10px;align-items:center;margin-bottom:15px;}
.logo img{width:30px;height:30px;}

.nav a{
  display:block;
  padding:10px;
  color:#aaa;
  cursor:pointer;
}
.nav a.active{background:#2c2c3e;color:#fff;}

.main{
  margin-left:220px;
  padding:30px;
  width:100%;
}

.section{display:none;}
.section-title{margin:10px 0;}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:10px;
}

.card{
  background:#2c2c3e;
  height:140px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  position:relative;
  cursor:pointer;
}

.card img{width:30px;}

.new-ribbon{
  position:absolute;
  top:10px;
  right:-30px;
  background:red;
  transform:rotate(45deg);
  padding:3px 25px;
  font-size:10px;
}

.test-ribbon{
  position:absolute;
  top:35px;
  right:-30px;
  background:gold;
  transform:rotate(45deg);
  padding:3px 25px;
  font-size:10px;
}

.topbar{
  position:fixed;
  right:10px;
  top:10px;
}

.switch{display:flex;gap:8px;cursor:pointer;}
.slider{
  width:40px;height:20px;
  background:#444;
  border-radius:20px;
  position:relative;
}
.slider:before{
  content:"";
  width:16px;height:16px;
  background:#fff;
  position:absolute;
  top:2px;left:2px;
  border-radius:50%;
  transition:.3s;
}
.switch input:checked + .slider:before{
  transform:translateX(20px);
}
</style>
</head>

<body>

<div class="topbar">
  <label class="switch">
    <input type="checkbox" onchange="toggleTheme()">
    <div class="slider"></div>
    <span id="themeText">🌙 Dark</span>
  </label>
</div>

<div class="sidebar">
  <div class="logo">
    <img src="logo.png">
    <strong>Portal</strong>
  </div>

  <div class="nav">
    <a class="active" onclick="show('all',this)">Dashboard</a>
    <a onclick="show('tp',this)">TP Tools</a>
    <a onclick="show('qa',this)">QA Tools</a>
    <a onclick="show('reports',this)">Reports</a>
    <a onclick="show('office',this)">Office</a>
  </div>
</div>

<div class="main">
<h2>Dashboard</h2>
<div id="app"></div>
</div>

<script>

const tools=[
  {id:"bms",name:"TP BMS",icon:"tp_bms.png",cat:"tp",isNew:0,isTest:0,url:"#"},
  {id:"csv",name:"CSV",icon:"logo.png",cat:"qa",isNew:1,isTest:1,url:"csvconverter.html"}
];

function toggleTheme(){
  document.body.classList.toggle("light");
  document.getElementById("themeText").innerText =
    document.body.classList.contains("light") ? "☀️ Light" : "🌙 Dark";
}

function render(){
  const app=document.getElementById("app");
  app.innerHTML="";

  ["tp","qa"].forEach(cat=>{
    let sec=document.createElement("div");
    sec.className="section";
    sec.dataset.cat=cat;

    sec.innerHTML=`
      <div class="section-title">${cat.toUpperCase()}</div>
      <div class="grid">
        ${tools.filter(t => t.cat === cat).map(t => card(t)).join("")}
      </div>
    `;

    app.appendChild(sec);
  });
}

function card(t){
  return `
  <div class="card" onclick="openTool('${t.id}')">
    ${t.isNew ? '<div class="new-ribbon">NEW</div>' : ''}
    ${t.isTest ? '<div class="test-ribbon">TEST</div>' : ''}
    <img src="${tme}</div>
  </div>`;
}

function openTool(id){
  let t=tools.find(x=>x.id===id);
  if(t.url.endsWith(".html")){
    location.href=t.url;
  }else{
    window.open(t.url,"_blank");
  }
}

function show(cat,el){
  document.querySelectorAll(".nav a").forEach(a=>a.classList.remove("active"));
  el.classList.add("active");

  document.querySelectorAll(".section").forEach(s=>{
    s.style.display=(cat==="all"||s.dataset.cat===cat)?"block":"none";
  });
}

render();
show("all", document.querySelector(".nav a"));

</script>

</body>
</html>
